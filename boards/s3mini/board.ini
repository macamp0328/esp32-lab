; Waveshare ESP32-S3 Mini (ESP32-S3FH4R2: 4 MB quad flash, 2 MB quad PSRAM, native USB).
; Stock devkitc-1 definition with overrides; custom board JSON is an M1 open question.
[boards_s3mini]
board = esp32-s3-devkitc-1
board_upload.flash_size = 4MB
board_upload.maximum_size = 4194304
board_build.partitions = default.csv
board_build.arduino.memory_type = qio_qspi
build_flags = -DLAB_BOARD_S3MINI -DARDUINO_USB_CDC_ON_BOOT=1 -DBOARD_HAS_PSRAM
lib_deps =
