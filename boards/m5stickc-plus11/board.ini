; M5StickC Plus 1.1 (ESP32-PICO-D4: 4 MB flash, no PSRAM). AXP192 rails via lab_board::begin().
; Stock m5stick-c JSON names variant m5stick_c, which core 3.x renamed: override variant + flag.
; lib_deps: one per line (comma lists break when interpolated into env lib_deps).
[boards_m5stickc_plus11]
board = m5stick-c
board_build.variant = m5stack_stickc_plus
board_build.extra_flags = -DARDUINO_M5STACK_STICKC_PLUS
build_flags = -DLAB_BOARD_M5STICKC_PLUS11
lib_deps =
  m5stack/M5Unified @ 0.2.27
  m5stack/M5GFX @ 0.2.34
