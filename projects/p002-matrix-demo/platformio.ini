; p002-matrix-demo: extends the lab-wide config in ../../platformio.common.ini.
; Supported boards = default_envs; CI builds each one. Host tests: `just test p002-matrix-demo`.
[platformio]
default_envs = m5stickc-plus11
extra_configs =
  ../../platformio.common.ini
  ../../boards/*/board.ini

[env]
; WiFi/OTA (lab_net) is left out of the build until you need it: when you set WIFI_ENABLED 1 in
; include/config.h, delete this line too (lab_checks.h stops the build if you forget).
lib_ignore = lab_net
