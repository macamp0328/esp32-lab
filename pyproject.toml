[project]
name = "esp32-lab-tools"
version = "0.0.0"
description = "Tooling for esp32-lab: checks, inventory, CI matrix, project scaffolding"
requires-python = ">=3.13,<3.14"
dependencies = [
  "platformio==6.2.0",
  "esptool==5.6.0",
  "pyserial==3.5",
  "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
  "clang-format==23.1.3",
  "pytest==9.1.1",
  "ruff==0.17.1",
  "rust-just==1.59.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tools/tests"]

[tool.ruff.lint.per-file-ignores]
"tools/pio_fw.py" = ["F821"]  # SCons injects env/projenv/Import
