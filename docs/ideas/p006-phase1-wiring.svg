<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 700" width="960" height="700" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <style>
    .box { fill: #f6f7f9; stroke: #333; stroke-width: 1.5; }
    .title { font-size: 19px; font-weight: bold; }
    .h { font-size: 15px; font-weight: bold; }
    .small { font-size: 12px; fill: #444; }
    .note { font-size: 13px; fill: #222; }
    .pin { font-size: 13px; }
    .w { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
    .lbl { font-size: 12px; fill: #333; }
  </style>
  <rect width="960" height="700" fill="#ffffff"/>

  <text x="20" y="32" class="title">p006 crystal ball · phase 1 prototype (s3mini on laptop USB)</text>
  <text x="20" y="54" class="small">Wiring sketch, not built yet. A dot means joined. Parts on hand, except the 18650 and holder in 1b.</text>

  <!-- ===== 1a ===== -->
  <text x="20" y="92" class="h">1a · ring powered from the board's 3V3 (first look)</text>

  <rect x="20" y="140" width="120" height="60" rx="6" class="box"/>
  <text x="80" y="166" text-anchor="middle">Laptop</text>
  <text x="80" y="184" text-anchor="middle" class="small">USB port</text>
  <line x1="140" y1="170" x2="200" y2="170" stroke="#666" stroke-width="7"/>
  <text x="170" y="158" text-anchor="middle" class="small">USB-C</text>

  <rect x="200" y="105" width="220" height="200" rx="8" class="box"/>
  <text x="214" y="130" class="h">s3mini</text>
  <text x="214" y="147" class="small">Waveshare ESP32-S3 Mini</text>
  <text x="410" y="170" text-anchor="end" class="pin">3V3</text>
  <text x="410" y="200" text-anchor="end" class="pin">GND</text>
  <text x="410" y="230" text-anchor="end" class="pin">GPIO 4 (LED_PIN)</text>
  <text x="410" y="260" text-anchor="end" class="pin">GPIO 5 (LED_CLOCK_PIN)</text>

  <rect x="640" y="135" width="200" height="150" rx="8" class="box"/>
  <text x="650" y="170" class="pin">5V</text>
  <text x="650" y="200" class="pin">G</text>
  <text x="650" y="230" class="pin">DI</text>
  <text x="650" y="260" class="pin">CI</text>
  <text x="770" y="190" text-anchor="middle" class="h">LuMini ring</text>
  <text x="770" y="208" text-anchor="middle" class="small">1 in · 20 × APA102</text>
  <text x="770" y="270" text-anchor="middle" class="small">CO, DO unused</text>

  <text x="740" y="303" text-anchor="middle" class="small">on the ring itself the pads run G, 5V, DI, CI, CO, DO</text>

  <polyline points="420,165 640,165" class="w" stroke="#d62828"/>
  <text x="530" y="158" text-anchor="middle" class="lbl">red · power</text>
  <polyline points="420,195 640,195" class="w" stroke="#222"/>
  <text x="530" y="188" text-anchor="middle" class="lbl">black · ground</text>
  <polyline points="420,225 640,225" class="w" stroke="#2a9d3a"/>
  <text x="530" y="218" text-anchor="middle" class="lbl">green · data</text>
  <polyline points="420,255 640,255" fill="none" stroke="#7a6000" stroke-width="6" stroke-linecap="round"/>
  <polyline points="420,255 640,255" fill="none" stroke="#f2c200" stroke-width="3.5" stroke-linecap="round"/>
  <text x="530" y="248" text-anchor="middle" class="lbl">yellow · clock</text>

  <text x="20" y="338" class="note">• Cap the ring at POWER_MAX_MA ≈ 150 mA: the s3mini's 3V3 regulator also feeds the chip and WiFi.</text>
  <text x="20" y="358" class="note">• The ring is rated at 5 V: use 1a for placement and palette; if it is dim or flickers, go to 1b.</text>

  <!-- ===== 1b ===== -->
  <text x="20" y="402" class="h">1b · ring powered from one 18650 (the final supply; board still on USB)</text>

  <rect x="450" y="410" width="160" height="40" rx="6" class="box"/>
  <text x="530" y="427" text-anchor="middle" class="pin">18650 in a holder</text>
  <text x="530" y="442" text-anchor="middle" class="small">protected cell</text>
  <text x="440" y="426" text-anchor="end" class="h">−</text>
  <text x="620" y="426" class="h">+</text>

  <rect x="20" y="505" width="120" height="60" rx="6" class="box"/>
  <text x="80" y="531" text-anchor="middle">Laptop</text>
  <text x="80" y="549" text-anchor="middle" class="small">USB port</text>
  <line x1="140" y1="535" x2="200" y2="535" stroke="#666" stroke-width="7"/>
  <text x="170" y="523" text-anchor="middle" class="small">USB-C</text>

  <rect x="200" y="470" width="220" height="120" rx="8" class="box"/>
  <text x="214" y="495" class="h">s3mini</text>
  <text x="410" y="505" text-anchor="end" class="pin">GND</text>
  <text x="410" y="535" text-anchor="end" class="pin">GPIO 4 (LED_PIN)</text>
  <text x="410" y="565" text-anchor="end" class="pin">GPIO 5 (LED_CLOCK_PIN)</text>

  <rect x="640" y="445" width="200" height="140" rx="8" class="box"/>
  <text x="650" y="475" class="pin">5V</text>
  <text x="650" y="505" class="pin">G</text>
  <text x="650" y="535" class="pin">DI</text>
  <text x="650" y="565" class="pin">CI</text>
  <text x="770" y="505" text-anchor="middle" class="h">LuMini ring</text>
  <text x="770" y="523" text-anchor="middle" class="small">1 in · 20 × APA102</text>

  <polyline points="610,430 626,430 626,470 640,470" class="w" stroke="#d62828"/>
  <text x="560" y="466" text-anchor="middle" class="lbl">red · cell +</text>
  <polyline points="450,430 432,430 432,500" class="w" stroke="#222"/>
  <polyline points="420,500 640,500" class="w" stroke="#222"/>
  <circle cx="432" cy="500" r="6" fill="#222"/>
  <text x="530" y="493" text-anchor="middle" class="lbl">black · ground (joined)</text>
  <polyline points="420,530 640,530" class="w" stroke="#2a9d3a"/>
  <text x="530" y="523" text-anchor="middle" class="lbl">green · data</text>
  <polyline points="420,560 640,560" fill="none" stroke="#7a6000" stroke-width="6" stroke-linecap="round"/>
  <polyline points="420,560 640,560" fill="none" stroke="#f2c200" stroke-width="3.5" stroke-linecap="round"/>
  <text x="530" y="553" text-anchor="middle" class="lbl">yellow · clock</text>

  <text x="20" y="620" class="note">• One ring supply at a time: in 1b the board's 3V3 is not wired to the ring.</text>
  <text x="20" y="640" class="note">• Put the multimeter in series on the red wire to read the ring's real current, lit and dark.</text>
  <text x="20" y="668" class="small">GPIO 4 is BOARD_LED_PIN, GPIO 5 is BOARD_LED_CLOCK_PIN in boards/s3mini/board.h.</text>
</svg>
