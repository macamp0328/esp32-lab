; Host tests for shared/lab_* (no hardware). Run by `just test-all`; not a firmware project.
; lib_ignore: lib_extra_dirs points at shared/, so LDF would otherwise treat this folder as a lib.
[platformio]
default_envs = native
extra_configs =
  ../../platformio.common.ini
  ../../boards/*/board.ini

[env:native]
lib_ignore = tests
