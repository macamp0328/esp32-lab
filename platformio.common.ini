; platformio.common.ini: every project extends this; boards are picked per env.
; Pinned. Do not upgrade anything here without a line in docs/decisions.md.
; `extends` does not merge options, so each env composes build_flags/lib_deps explicitly.
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
build_flags = -DLAB_SERIAL_JSON=1 -I${PROJECT_DIR}/../../boards
lib_deps = fastled/FastLED @ 3.10.7
lib_extra_dirs = ${PROJECT_DIR}/../../shared
extra_scripts = post:../../tools/pio_fw.py

; one env per supported board; each pulls its boards/<name>/board.ini fragment
[env:s3mini]
extends = common, boards_s3mini
build_flags = ${common.build_flags} ${boards_s3mini.build_flags}
lib_deps =
  ${common.lib_deps}
  ${boards_s3mini.lib_deps}

[env:m5stickc-plus11]
extends = common, boards_m5stickc_plus11
build_flags = ${common.build_flags} ${boards_m5stickc_plus11.build_flags}
lib_deps =
  ${common.lib_deps}
  ${boards_m5stickc_plus11.lib_deps}

[env:native]
platform = platformio/native @ 1.2.1
test_framework = unity
build_flags = -std=c++17 -DLAB_NATIVE=1 -I${PROJECT_DIR}/../../boards
lib_extra_dirs = ${common.lib_extra_dirs}
